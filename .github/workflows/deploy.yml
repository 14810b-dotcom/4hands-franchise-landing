name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/landings

            # Pull latest code
            git pull origin main

            # Restart Node.js AMO server if server code changed
            if git diff HEAD~1 --name-only | grep -q 'server/'; then
              pm2 restart amo-lead || pm2 start npm --name amo-lead -- start
            fi

            # Sync nginx config from repo and reload
            cp /var/www/landings/nginx.conf /etc/nginx/sites-available/4you.4hands.ru
            nginx -t && systemctl reload nginx

            echo "Deploy done: $(date)"
