name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/landings

            # Pull latest code
            git pull origin main

            # AMO lead server: (re)start with fresh env every deploy so secret
            # rotations / new origins take effect without manual SSH.
            # Skips (with a log line) if AMO_TOKEN secret isn't set yet.
            export AMO_SUBDOMAIN='${{ secrets.AMO_SUBDOMAIN }}'
            export AMO_TOKEN='${{ secrets.AMO_TOKEN }}'
            export AMO_PIPELINE_ID='${{ secrets.AMO_PIPELINE_ID }}'
            export AMO_RESPONSIBLE_USER_ID='${{ secrets.AMO_RESPONSIBLE_USER_ID }}'
            export ALLOWED_ORIGINS='https://4you.4hands.ru,https://franchbeaty.ru,https://www.franchbeaty.ru'

            if [ -n "$AMO_TOKEN" ]; then
              pm2 restart amo-lead --update-env || pm2 start npm --name amo-lead --update-env -- start
              pm2 save
              echo "amo-lead: (re)started with current env"
            else
              echo "amo-lead: AMO_TOKEN secret not set — skipping start (see gh secret set commands)"
            fi

            # Sync nginx config from repo and reload
            cp /var/www/landings/nginx.conf /etc/nginx/sites-available/4you.4hands.ru
            nginx -t && systemctl reload nginx

            # One-time, idempotent: issue certs for extra domains once their DNS
            # points here. Skips instantly per-domain if already issued. Uses
            # `certonly` (not `--nginx`) so it does NOT self-edit nginx config —
            # avoids drift with the repo's nginx.conf, which stays the source of
            # truth. Wrapped so a failure here (e.g. DNS not propagated yet) never
            # aborts the rest of this deploy — main site is unaffected either way.
            if [ ! -f /etc/letsencrypt/live/franchbeaty.ru/fullchain.pem ]; then
              certbot certonly --nginx -d franchbeaty.ru -d www.franchbeaty.ru --non-interactive --agree-tos \
                && echo "certbot: issued cert for franchbeaty.ru" \
                || echo "certbot: skipped franchbeaty.ru (DNS likely not propagated yet) — will retry on next deploy"
            fi

            echo "Deploy done: $(date)"
