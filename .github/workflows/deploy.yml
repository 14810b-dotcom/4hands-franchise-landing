name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/landings

            # Pull latest code
            git pull origin main

            # Restart Node.js AMO server if server code changed
            if git diff HEAD~1 --name-only | grep -q 'server/'; then
              pm2 restart amo-lead || pm2 start npm --name amo-lead -- start
            fi

            # Sync nginx config from repo and reload
            cp /var/www/landings/nginx.conf /etc/nginx/sites-available/4you.4hands.ru
            nginx -t && systemctl reload nginx

            # One-time, idempotent: issue cert for new.4hands.ru once DNS
            # points here. Skips instantly if already issued. Uses `certonly`
            # (not `--nginx`) so it does NOT self-edit nginx config — avoids
            # drift with the repo's nginx.conf, which stays the source of truth.
            # Wrapped so a failure here (e.g. DNS not propagated yet) never
            # aborts the rest of this deploy — main site is unaffected either way.
            if [ ! -f /etc/letsencrypt/live/new.4hands.ru/fullchain.pem ]; then
              certbot certonly --nginx -d new.4hands.ru --non-interactive --agree-tos \
                && echo "certbot: issued cert for new.4hands.ru" \
                || echo "certbot: skipped (DNS likely not propagated yet) — will retry on next deploy"
            fi

            echo "Deploy done: $(date)"
