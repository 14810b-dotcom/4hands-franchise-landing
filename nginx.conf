# nginx config for 4you.4hands.ru
# Place at: /etc/nginx/sites-available/4you.4hands.ru
# Enable: ln -s /etc/nginx/sites-available/4you.4hands.ru /etc/nginx/sites-enabled/
#
# Assumes:
#   - Static files cloned to /var/www/landings (git repo root)
#   - Node.js AMO server running on localhost:3001 (via PM2)
#   - Tilda origin = 185.215.4.21 (replace below)
#   - HTTPS managed by Certbot (adds ssl lines automatically after: certbot --nginx -d 4you.4hands.ru)

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name 4you.4hands.ru;
    return 301 https://$host$request_uri;
}

# ── HTTPS main ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name 4you.4hands.ru;

    ssl_certificate     /etc/letsencrypt/live/4you.4hands.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4you.4hands.ru/privkey.pem;

    # ── Custom coded pages ─────────────────────────────────────────────────
    # To add a new page: copy the block below, replace "franch" with new slug.
    # Then run: sudo nginx -t && sudo systemctl reload nginx

    location /franch {
        root /var/www/landings;
        try_files $uri $uri/ /franch/index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location /franch-v2 {
        root /var/www/landings;
        try_files $uri $uri/ /franch-v2/index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Domain root → franch-v2 ───────────────────────────────────────────
    # 4you.4hands.ru/ now serves franch-v2 directly (replaces the Tilda
    # homepage). Only the exact "/" path and franch-v2's own root-relative
    # asset paths are claimed here — everything else (blog, /o-kompanii,
    # etc.) still falls through to the Tilda catch-all below untouched.
    location = / {
        root /var/www/landings/franch-v2;
        try_files /index.html =404;
    }
    location = /main.js {
        root /var/www/landings/franch-v2;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /style.css {
        root /var/www/landings/franch-v2;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /tailwind.css {
        root /var/www/landings/franch-v2;
        add_header Cache-Control "public, max-age=3600";
    }
    location /assets/ {
        root /var/www/landings/franch-v2;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /salon-krasoty {
        root /var/www/landings;
        try_files $uri $uri/ /salon-krasoty/index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location /salon-krasoty/_next/static/ {
        root /var/www/landings;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── AMO API (Node.js) ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # ── Static assets served directly ──────────────────────────────────────
    location /robots.txt  { root /var/www/landings; }
    location /sitemap.xml { root /var/www/landings; }

    # ── Everything else → Tilda ────────────────────────────────────────────
    # Replace 185.215.4.21 with actual origin (e.g. project123456.tilda.ws)
    # Find it: Tilda dashboard → Site settings → Domain → "System domain"
    location / {
        proxy_pass         https://185.215.4.21;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;

        # Cache Tilda pages at edge
        proxy_cache_bypass $http_pragma;
        proxy_cache_valid  200 10m;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;
}

# ================================================================================
# franchbeaty.ru — второй домен под тот же сайт для Казахстана/Узбекистана (franch-cis)
# Тот же VPS, домен зарегистрирован на Рег.ру, DNS A-записи @ и www -> IP этого VPS.
# Сертификат выпущен certbot'ом (deploy.yml, шаг certonly), HTTPS активен.
# ================================================================================

server {
    listen 80;
    server_name franchbeaty.ru www.franchbeaty.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name franchbeaty.ru www.franchbeaty.ru;

    ssl_certificate     /etc/letsencrypt/live/franchbeaty.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/franchbeaty.ru/privkey.pem;

    root /var/www/landings/franch-cis;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── /uz — тот же сайт, локализация под Узбекистан (franch-uz) ──────────
    # Отдельная папка (не совпадает с последним сегментом URL), поэтому alias,
    # а не root+try_files, как у остальных custom coded pages.
    location = /uz {
        return 301 /uz/;
    }

    location /uz/ {
        alias /var/www/landings/franch-uz/;
        try_files $uri $uri.html $uri/ /uz/index.html;
        index index.html;
    }

    location /uz/assets/ {
        alias /var/www/landings/franch-uz/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;
}
